<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
  <title id="title">Mac Glass Dock</title>
  <desc id="desc">Glass that follows your desktop. A first public preview for KDE Plasma on Wayland.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081e27"/><stop offset=".56" stop-color="#143d47"/><stop offset="1" stop-color="#132a41"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7ddac3" stop-opacity=".3"/><stop offset="1" stop-color="#7ddac3" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x2=".8" y2="1"><stop stop-color="#e2ffff" stop-opacity=".24"/><stop offset=".45" stop-color="#b0e8df" stop-opacity=".04"/><stop offset="1" stop-color="#a1b9e4" stop-opacity=".19"/></linearGradient>
    <linearGradient id="rim" x2=".9" y2="1"><stop stop-color="#efffff" stop-opacity=".9"/><stop offset=".38" stop-color="#b3e8dd" stop-opacity=".15"/><stop offset=".7" stop-color="#d3e8ff" stop-opacity=".18"/><stop offset="1" stop-color="#e9fff6" stop-opacity=".7"/></linearGradient>
  </defs>
  <rect width="1280" height="330" rx="24" fill="url(#bg)"/>
  <ellipse cx="985" cy="125" rx="370" ry="300" fill="url(#glow)"/>
  <g fill="none" stroke="#a2ddcf" stroke-opacity=".12">
    <path d="M725 330C890 200 830 90 1030 0"/><path d="M775 330C940 200 880 90 1080 0"/>
    <path d="M825 330C990 200 930 90 1130 0"/><path d="M875 330C1040 200 980 90 1180 0"/>
    <path d="M925 330C1090 200 1030 90 1230 0"/><path d="M975 330C1140 200 1080 90 1280 0"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="58" y="63" fill="#99d9c9" font-size="12" font-weight="700" letter-spacing="3.2">LINUX, THROUGH A DIFFERENT LENS.</text>
    <text x="54" y="145" fill="#f3faf6" font-size="70" font-weight="600" letter-spacing="-3">Mac Glass Dock</text>
    <text x="58" y="190" fill="#c1d8d8" font-size="23">Glass that follows your desktop.</text>
    <rect x="58" y="238" width="218" height="34" rx="17" fill="#a5e9d1" fill-opacity=".1" stroke="#a5e9d1" stroke-opacity=".26"/>
    <circle cx="76" cy="255" r="4" fill="#a5e9d1"/>
    <text x="90" y="260" fill="#d4eee2" font-size="12" letter-spacing=".8">FIRST PUBLIC PREVIEW</text>
    <text x="298" y="260" fill="#a8c8ca" font-size="13">KDE PLASMA 6 / WAYLAND</text>
  </g>
  <g transform="translate(868 65) rotate(-9 135 100)">
    <rect x="0" y="0" width="270" height="194" rx="51" fill="url(#glass)" stroke="url(#rim)" stroke-width="2"/>
    <rect x="7" y="7" width="256" height="180" rx="45" fill="none" stroke="#f0fffa" stroke-opacity=".15"/>
    <rect x="43" y="46" width="79" height="91" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="143" y="46" width="79" height="91" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
    <path d="m71 80 15 13-15 13m96-26h31m-31 13h22m-22 13h31" fill="none" stroke="#e7fff6" stroke-opacity=".8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="126" y="162" width="19" height="4" rx="2" fill="#c2f6df"/>
  </g>
</svg>
